# ==============================================================================
# Render Blueprint Configuration (render.yaml)
# Backend + PostgreSQL on Render; Storefront hosted separately on Vercel.
# ==============================================================================
databases:
  - name: dilwale-bags-db
    databaseName: medusa
    user: medusa
    plan: free

services:
  # ----------------------------------------------------------------------------
  # Dilwale Bags Medusa v2 Backend
  # ----------------------------------------------------------------------------
  - type: web
    name: dilwale-bags-backend
    runtime: image
    image:
      url: docker.io/steel777/dilwale-bags-backend:latest
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 9000
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS
        value: "--max-old-space-size=384"
      - key: DATABASE_URL
        fromDatabase:
          name: dilwale-bags-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true
      - key: STORE_CORS
        # Your Vercel URL, e.g. https://dilwale-bags.vercel.app
        sync: false
      - key: ADMIN_CORS
        value: https://dilwale-bags-backend.onrender.com
      - key: AUTH_CORS
        # Comma-separated Vercel + Render URLs, e.g. https://dilwale-bags.vercel.app,https://dilwale-bags-backend.onrender.com
        sync: false
      - key: NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY
        value: pk_a1b1a57e199157b891153b25fe6a027815989c7a87fdd5cc874612e8d6723a0c
      - key: SELF_PING_URL
        value: https://dilwale-bags-backend.onrender.com/health
      - key: AUTO_SEED
        value: "true"
